# Where the time goes: DiTriC (patric), CETRIC (cetric-x) and pre-CETRIC (cetric), with direct and grid communication,
# one thread per rank, on locality x skew inputs (phases.instances.yaml). Power-of-two multiples of a node up to 3072 cores (SuperMUC-NG: 48, 96, ..., 1536, 3072);
# `--cores` overrides them.
# Phases are separated by barriers (global-synchronization), which run in nested `barrier` regions, so a phase's
# exclusive time is the rank's own work and `barrier` is the imbalance. The global phase additionally has
# `termination` and the counters send_ns / handle_ns; the input's shape (cut edges, interface nodes) is in `ingest`.
# Up to 7cf91b7 the second configuration was cetric-x with neighborhoods sorted purely by degree
# (`id-node-ordering: false`, removed in step 1 of doc/refactoring-plan.md); later configurations moved up by one.
# Evaluate with `just notebook`. A laptop version is local/phases.suite.yaml.
name: phases
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: node-size-pow2
max_cores: 3072
threads_per_rank: [1]
time_limit: 5
graphs:
  - import: phases
config:
  - algorithm: [patric, cetric-x]
    binary-rank-search: true
    threshold: local-nodes
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: new
    primary-cost-function: none
    intersection-method: merge
    iterations: 3
  # appended (so the indices of the configurations above stay the same): pre-CETRIC, cut edges oriented outward in
  # the local phase, no ghost expansion
  - algorithm: cetric
    binary-rank-search: true
    threshold: local-nodes
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: new
    primary-cost-function: none
    intersection-method: merge
    iterations: 3
  # appended: the three algorithms with the 2D grid indirection in the global phase (the paper's choice at large p)
  - algorithm: [patric, cetric-x, cetric]
    binary-rank-search: true
    threshold: local-nodes
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: grid
    primary-cost-function: none
    intersection-method: merge
    iterations: 3
