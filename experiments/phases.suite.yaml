# Where the time goes: DiTriC (patric) and CETRIC (cetric-x), one thread per rank, on locality x skew inputs
# (phases.instances.yaml). Power-of-two multiples of a node up to 3072 cores (SuperMUC-NG: 48, 96, ..., 1536, 3072);
# `--cores` overrides them.
# Phases are separated by barriers (global-synchronization), which run in nested `barrier` regions, so a phase's
# exclusive time is the rank's own work and `barrier` is the imbalance. The global phase additionally has
# `termination` and the counters send_ns / handle_ns; the input's shape (cut edges, interface nodes) is in `ingest`.
# The cetric-x variant without id-node-ordering sorts all neighborhoods purely by degree (the old ordering; not
# compact-forward ordering, which needs a cheaper key, see doc/refactoring-plan.md).
# Evaluate with `just notebook phases`. A laptop version is local/phases.suite.yaml.
name: phases
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: node-size-pow2
max_cores: 3072
threads_per_rank: [1]
time_limit: 15
graphs:
  - import: phases
config:
  - algorithm: [patric, cetric-x]
    binary-rank-search: true
    threshold: local-nodes
    id-node-ordering: true
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: new
    primary-cost-function: none
    intersection-method: merge
    iterations: 3
  - algorithm: cetric-x
    binary-rank-search: true
    threshold: local-nodes
    id-node-ordering: false
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: new
    primary-cost-function: none
    intersection-method: merge
    iterations: 3
