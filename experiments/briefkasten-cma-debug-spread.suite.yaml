# briefkasten-cma-debug c0 / c1 (grid 16 / 64 KiB, checks off, memory sampler) with 24 ranks per node: the same 384
# ranks and data on 16 nodes, twice the memory per rank. Passes here but aborts in briefkasten-cma-debug: memory.
# Run with the same command template:
#   just run-supermuc-experiment briefkasten-cma-debug-spread --copy-binary \
#     --command-template experiments/briefkasten-cma-debug.command-template.txt
name: briefkasten-cma-debug-spread
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [384]
max_cores: 384
tasks_per_node: 24
threads_per_rank: [1]
time_limit: 10
graphs:
  - generator: kagen
    type: rmat
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [16384, 65536]
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      BRIEFKASTEN_CHECK_BUFFERS: "off"
