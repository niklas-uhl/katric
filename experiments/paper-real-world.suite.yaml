# Strong scaling of DiTriC (patric) and CETRIC (cetric-x) on the real-world graphs, both communication policies.
# Ported from legacy/paper-suites/real-world.suite.yaml; the algorithm options are configs/ditric.toml and
# configs/cetric.toml.
name: paper-real-world
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [512, 1024, 2048, 4096, 8192, 16384, 32768]
max_cores: 32768
threads_per_rank: [1]
graphs:
  - import: paper-real-world
config:
  - algorithm: [patric, cetric-x]
    binary-rank-search: true
    threshold: local-nodes
    threshold-scale: 1.0
    local-degree-of-parallelism: 2
    global-degree-of-parallelism: 2
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: [new, grid]
    primary-cost-function: none
    intersection-method: merge
    iterations: 2
