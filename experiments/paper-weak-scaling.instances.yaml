# Generated graphs of the paper's weak scaling, as KaGen option strings: 2^N vertices and 2^M edges per core.
# Same generators and sizes as the paper (rgg2d, rhg with gamma 2.8, gnm-undirected); the seed is the one the
# paper's runs used. The KaGen version is newer, so the graphs need not be bit-identical to the paper's.
name: paper-weak-scaling
graphs:
  - generator: kagen
    type: rgg2d
    N: 18
    M: 22
    seed: 28475421
    scale_weak: true
  - generator: kagen
    type: rhg
    N: 18
    M: 22
    gamma: 2.8
    seed: 28475421
    scale_weak: true
  - generator: kagen
    type: gnm-undirected
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
