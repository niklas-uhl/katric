# `baseline` on RMAT (KaGen defaults, the paper's weak-scaling size), where only balanced runs are sensible: without
# load balancing an iteration takes 46 s at 48 and 187 s at 192 cores (lb-cost-rmat), and jobs at 1536 cores ran out
# of memory. So IDPD only (which fixes the work imbalance, lb-cost-rmat), up to 768 cores; the variant, the global
# phase's communication and message trimming as in `baseline`. Two iterations. `--max-cores 768` when creating the
# job files.
# Defaults changed 2026-11-23 (IDPD, --rebalance-threshold 1.5, --rebalance-precheck degree-bound, message trimming
# on); the options below pin this suite's earlier behaviour.
name: baseline-rmat
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: node-size-pow2
threads_per_rank: [1]
time_limit: 15
graphs:
  - generator: kagen
    type: rmat
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - contraction: [false, true]
    communication-policy: [direct, grid]
    primary-cost-function: IDPD
    rebalance-threshold: 1
    rebalance-precheck: none
    no-message-trimming: [true, false]
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 2
