# Does the BriefKAsten pool fix hold on the cluster, and what does it cost? (doc/briefkasten-migration.md, step 8:
# BriefKAsten 82d1283 / PR #29, the pool leak; 1404471 / PR #30, the reserve bound; katric 8fa817d pins 1404471.)
# RMAT at 384 and 768 cores, the inputs and options of briefkasten-rmat_26_11_24 (poll-skip 1), plus the current
# default (direct 4 KiB, poll-skip 100):
#   c0  direct 4 KiB          before: global phase 19.0 s (384) / 28.0 s (768), briefkasten-rmat c2
#   c1  grid 4 KiB            before: 22.3 s / 31.0 s, briefkasten-rmat c5
#   c2  grid 16 KiB           before: node out of memory in iteration 1 or 2 (cma_read_nbytes abort)
#   c3  grid 64 KiB           before: as c2
#   c4  direct 4 KiB, skip 100  before: 18.4 s / 27.7 s, briefkasten-tuning-rmat c1
# (global phase: max over ranks, summed over the 3 iterations, timers json.) Reading it: c2 / c3 must pass all
# iterations; memory from the probe's counters (KATRIC_MEMORY_PROBE, aggregated: mem_* max over ranks per snapshot)
# and the node sampler (<run>.mem.<host>); the cost of the restored backpressure from buffer_stalls, reserve_waits,
# peak_reserve_buffers next to the global phase time.
# For the test partition (SuperMUC-NG is full; at most 16 nodes, 30 minutes per job): one job per core count, 5 runs
# of at most 5 minutes (25 minutes). Generate without submitting, then submit with `sbatch -p test <jobfile>`
# (overrides the micro partition in the job file; kaval's --test flag is not wired to the runner):
#   just run-supermuc-experiment briefkasten-pool-fix --copy-binary \
#     --command-template experiments/briefkasten-cma-debug.command-template.txt
name: briefkasten-pool-fix
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [384, 768]
max_cores: 768
threads_per_rank: [1]
time_limit: 5
graphs:
  - generator: kagen
    type: rmat
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - message-queue: briefkasten
    communication-policy: direct
    buffer-size: 4096
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV: &env
      KATRIC_MEMORY_PROBE: 1
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [4096, 16384, 65536]
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV: *env
  - message-queue: briefkasten
    communication-policy: direct
    buffer-size: 4096
    poll-skip: 100
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV: *env
