# Threshold-gated rebalancing and the cost function IDD (e13a2de) against `baseline` (2026-11-20): DiTriC, direct,
# message trimming (the best configuration of `baseline` nearly everywhere), on the `phases` inputs and GNM at the
# core counts `baseline` ran (`--min-cores 192 --max-cores 3072` when creating the job files). none and IDPD at threshold 1 repeat `baseline`'s configurations with the new code
# (fadbd12: ghost push pattern built once); IDPD / IDD at threshold 1.5 should keep the graph on every input here
# (cost max/avg 1.0-1.3 in the model; the counters `rank_cost` and `rebalanced` in primary_load_balancing tell), so
# they should cost the cost function only, with the degree exchange reused. RMAT, which needs the rebalancing, is in
# rebalance-rmat.
# Results 2026-11-23 in doc/refactoring-plan.md. IDD was removed afterwards (it overestimates RHG; it lives on as
# --rebalance-precheck degree-bound): the IDD configurations no longer parse.
name: rebalance
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: node-size-pow2
threads_per_rank: [1]
time_limit: 10
graphs:
  - import: phases
  - generator: kagen
    type: gnm-undirected
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - primary-cost-function: none
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
  - primary-cost-function: IDPD
    rebalance-threshold: 1
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
  - primary-cost-function: [IDPD, IDD]
    rebalance-threshold: 1.5
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
