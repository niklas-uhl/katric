# `briefkasten-tuning` on RMAT with the default load balancing (up to `--max-cores 768`), where almost every buffer
# waited for a request slot in `briefkasten-rmat`. 4 configurations per core count.
name: briefkasten-tuning-rmat
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: node-size-pow2
threads_per_rank: [1]
time_limit: 10
graphs:
  - generator: kagen
    type: rmat
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - message-queue: briefkasten
    communication-policy: direct
    buffer-size: 4096
    request-slots: [8, 32]
    poll-skip: [1, 100]
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
