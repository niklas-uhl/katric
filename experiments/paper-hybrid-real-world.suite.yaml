# Hybrid (MPI + TBB) CETRIC on the real-world graphs: edge partitioning, local and global parallelism with task
# priorities, grid communication. Ported from legacy/paper-suites/hybrid-realworld.suite.yaml; the old suite's time
# limits were lower (europe, orkut 1, live-journal 2, uk-2007-05, twitter 5 minutes).
name: paper-hybrid-real-world
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [768, 1536, 3072, 6144]
threads_per_rank: [1, 3, 6, 12, 24, 48]
graphs:
  - import: real-world-core
config:
  - algorithm: cetric-x
    binary-rank-search: true
    threshold: local-nodes
    threshold-scale: 1.0
    edge-partitioning: true
    local-parallel: true
    global-parallel: true
    local-degree-of-parallelism: 2
    global-degree-of-parallelism: 2
    dense-degree-exchange: true
    global-synchronization: true
    communication-policy: grid
    primary-cost-function: none
    intersection-method: merge
    task-pool-type: task-group
    task-priorities: true
    iterations: 1
