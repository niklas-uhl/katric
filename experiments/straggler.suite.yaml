# Per-rank times of the ghost exchanges at 1536 cores (2026-11-21). In `baseline`, on the permuted inputs one rank's
# `prepare` of the cost function's and the degree exchange's push_to_ghosts takes ~2x the average (max 2.46 vs avg
# 1.17 s at 1536), and every other rank waits for it in the exchange; it did not reproduce on the laptop. Run with the
# code after fadbd12 (send pattern built once per graph), DiTriC, direct, trimming, permuted RGG; IDPD (two exchanges
# on the input graph plus one after the redistribution) and none (one exchange). Compare the aggregates with
# `baseline_26_11_20` (same input and options).
#
# Besides the usual output, Caliper's recorder (environment-configured, no code change) writes one profile per rank to
# straggler-perrank/<config>/rank-<rank>.cali, relative to the directory the job was submitted from (kaval quotes the
# values, so no $PWD). Region times are exclusive (`sum#time.duration.ns`), aggregated over the iterations by
# nested path; with --perhost 48 the node of a rank is rank / 48 (the job log lists the nodes). Question: is the slow
# rank the same in every iteration and configuration, or on the same node?
# Results 2026-11-23 (doc/refactoring-plan.md): 33-62 ranks on nodes 21-31, the same in every iteration and
# configuration, slow only in `prepare/pattern`. Since then the pattern build reports per rank (counters, recorded by
# the recorder as it keys on counter.name too) page faults, CPU, NUMA node, transparent huge pages and, if perf events
# are allowed, cycles / instructions / dTLB load misses: rerun, then `eval/perrank.py --counters`. Does it stay with
# the nodes, and is it the pages / TLB?
# Defaults changed 2026-11-23: the IDPD configuration pins the threshold 1 without the pre-check (redistributes as
# before), both pin message trimming (now the default).
# Results of the rerun (2026-11-23, other nodes): the same ranks are slow, with the same instructions but 3.3x the
# cycles and 22x the dTLB load misses; their processes have ~15-20 MB fewer transparent huge pages. Hypothesis: on those
# ranks a ~32 MiB array (owners_, 4 B per ghost, ~8.38 M ghosts) is not backed by huge pages, as glibc places it by its
# dynamic mmap threshold (at most 32 MiB). Appended configurations (none, as the second one) test that without code
# changes:
#   hugetlb:   GLIBC_TUNABLES=glibc.malloc.hugetlb=1, malloc madvises THP for its allocations (glibc >= 2.35; the
#              version is recorded as memory.glibc, older ones ignore the tunable silently)
#   mmap-1m:   MALLOC_MMAP_THRESHOLD_=1 MiB, fixed (no dynamic threshold): every large array from mmap
#   mmap-32m:  MALLOC_MMAP_THRESHOLD_=32 MiB (the maximum), fixed: arrays below 32 MiB from the heap
# If the slow ranks disappear in one of them, the placement is the cause. KATRIC_RESOURCE_COUNTERS turns the per-rank
# resource counters on (opt-in since they cost ~40 ms per pattern build); the THP mode is recorded as memory.thp_*.
name: straggler
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [1536]
max_cores: 1536
threads_per_rank: [1]
time_limit: 10
graphs:
  - generator: kagen
    type: rgg2d
    N: 18
    M: 22
    permute: 1
    seed: 28475421
    scale_weak: true
config:
  - primary-cost-function: IDPD
    rebalance-threshold: 1
    rebalance-precheck: none
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV: &perrank
      CALI_SERVICES_ENABLE: aggregate,event,mpi,recorder,timer
      CALI_AGGREGATE_KEY: prop:nested,mpi.rank,counter.name
      KATRIC_RESOURCE_COUNTERS: 1
      CALI_RECORDER_FILENAME: straggler-perrank/idpd/rank-%mpi.rank%.cali
  - primary-cost-function: none
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      <<: *perrank
      CALI_RECORDER_FILENAME: straggler-perrank/none/rank-%mpi.rank%.cali
  # appended 2026-11-23: the allocator variants (see above)
  - primary-cost-function: none
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      <<: *perrank
      CALI_RECORDER_FILENAME: straggler-perrank/none-hugetlb/rank-%mpi.rank%.cali
      GLIBC_TUNABLES: glibc.malloc.hugetlb=1
  - primary-cost-function: none
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      <<: *perrank
      CALI_RECORDER_FILENAME: straggler-perrank/none-mmap-1m/rank-%mpi.rank%.cali
      MALLOC_MMAP_THRESHOLD_: 1048576
  - primary-cost-function: none
    message-trimming: true
    communication-policy: direct
    threshold: local-nodes
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      <<: *perrank
      CALI_RECORDER_FILENAME: straggler-perrank/none-mmap-32m/rank-%mpi.rank%.cali
      MALLOC_MMAP_THRESHOLD_: 33554432
