# Is the Intel MPI abort of `briefkasten-rmat` the transport? (doc/briefkasten-migration.md, step 6, "Crashes".) On
# RMAT at 384 and 768 cores, BriefKAsten grid with 16 / 64 KiB buffers (and legacy grid at 768) aborted with
# `intel_transport_recv.h:1267: cma_read_nbytes == size`, the single-copy (CMA) path for large intra-node messages;
# 4 KiB grid and every direct run passed. Intel support suggested I_MPI_SHM_CMA=0 for this assertion (community thread
# 1329425). Here the crashing configurations at 384 cores (where all three crashed), each with CMA as before and with
# I_MPI_SHM_CMA=0, plus direct 16 KiB with CMA off for the cost of turning it off on a run that passed (25.5 s at 768,
# 19.6 at 384 before). If the CMA-off runs pass, the abort is in the transport (or in how the relayed buffers meet
# it); if they still fail elsewhere, look at BriefKAsten's buffer lifetime in the grid. One core count; with
# --copy-binary. The environment is not in the run metadata: runs c0, c1 (grid 16 / 64 KiB) have CMA on, c2, c3 (grid
# 16 / 64 KiB) and c4 (direct 16 KiB) have I_MPI_SHM_CMA=0 (the run name ends in -c<i>-s0).
name: briefkasten-cma-debug
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [384]
max_cores: 384
threads_per_rank: [1]
time_limit: 15
graphs:
  - generator: kagen
    type: rmat
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [16384, 65536]
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [16384, 65536]
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      I_MPI_SHM_CMA: 0
  - message-queue: briefkasten
    communication-policy: direct
    buffer-size: 16384
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      I_MPI_SHM_CMA: 0
