# Is the Intel MPI abort of `briefkasten-rmat` a BriefKAsten bug or the transport? (doc/briefkasten-migration.md,
# step 6 "Crashes" and step 8.) On RMAT at 384 and 768 cores, BriefKAsten grid with 16 / 64 KiB buffers (and legacy
# grid at 768) aborted in Intel MPI's single-copy path for large intra-node messages
# (`intel_transport_recv.h:1267: cma_read_nbytes == size`); 4 KiB grid and every direct run passed.
# History: run 1 (I_MPI_SHM_CMA=0, no effect): every grid run aborted. Run 2 (buffer check full): all passed. Run 3
# (checks off / light / full, I_MPI_SHM=off): only full passed; light never fired; with I_MPI_SHM=off PSM2's
# intra-node CMA failed the same way (`ptl_am/ptl.c:153`). Always in iteration 2, always with the node of ranks
# 336-383 involved.
#
# Run 4: why does process_vm_readv fail? Run with the command template next to this file:
#   just run-supermuc-experiment briefkasten-cma-debug --copy-binary \
#     --command-template experiments/briefkasten-cma-debug.command-template.txt
# (and the same for briefkasten-cma-debug-spread). The check build of run 3 is fine (every config sets
# BRIEFKASTEN_CHECK_BUFFERS=off; the build's default would be full). The template wraps every rank in bash:
# local rank 0 of each node samples /proc/meminfo, the job's memory cgroup (usage, failcnt / events) and the largest
# katric RSS once a second into <run>.mem.<host>; with CMA_DEBUG_STRACE=1 each rank runs under
# `strace -f --seccomp-bpf -Z -e trace=process_vm_readv,process_vm_writev` (only failed calls, with errno) into
# <run>.strace.<rank>. Needs strace >= 5.3 for --seccomp-bpf (`strace -V`).
#   c0, c1  grid 16 / 64 KiB, memory sampler only (the memory state when it aborts)
#   c2, c3  grid 16 / 64 KiB, + strace, Intel shm transport
#   c4, c5  grid 16 / 64 KiB, + strace, I_MPI_SHM=off (PSM2's CMA returned -1 in run 3, so strace sees the errno)
#   c6      grid 4 KiB (passed so far), memory sampler: the memory of a passing grid run
#   c7      direct 4 KiB (passed so far), memory sampler
# Reading it: `grep -h process_vm_readv *.strace.*` gives the errno. EFAULT: an address range not mapped (any more)
# in one of the two processes, the iovecs say which buffer; ENOMEM: the kernel could not get the pages, with the
# .mem files near the limit / failcnt rising: memory pressure; ESRCH / EPERM: the peer process. If the strace runs
# pass, strace changed the timing (as the full check did). The suite briefkasten-cma-debug-spread runs c0 / c1 with
# 24 ranks per node (16 nodes, twice the memory per rank, same ranks).
name: briefkasten-cma-debug
executable: apps/katric
output_path_option_name: caliper-output
threads_option_name: num-threads
ncores: [384]
max_cores: 384
threads_per_rank: [1]
time_limit: 10
graphs:
  - generator: kagen
    type: rmat
    N: 16
    M: 20
    seed: 28475421
    scale_weak: true
config:
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [16384, 65536]
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      BRIEFKASTEN_CHECK_BUFFERS: "off"
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [16384, 65536]
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      BRIEFKASTEN_CHECK_BUFFERS: "off"
      CMA_DEBUG_STRACE: 1
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: [16384, 65536]
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      BRIEFKASTEN_CHECK_BUFFERS: "off"
      CMA_DEBUG_STRACE: 1
      I_MPI_SHM: "off"
  - message-queue: briefkasten
    communication-policy: grid
    buffer-size: 4096
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      BRIEFKASTEN_CHECK_BUFFERS: "off"
  - message-queue: briefkasten
    communication-policy: direct
    buffer-size: 4096
    poll-skip: 1
    message-trimming: true
    degree-exchange: dense
    intersection-method: merge
    iterations: 3
    ENV:
      BRIEFKASTEN_CHECK_BUFFERS: "off"
