[project]
name = "katric-experiments"
version = "0.1.0"
description = "Experiment runner (kaval) and evaluation scripts for katric."
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
]

[tool.uv]
package = false

[dependency-groups]
# evaluation (eval/): Thicket reads the Caliper profiles, polars and plotnine for tables and plots
eval = [
    "llnl-thicket[plotting]",  # [plotting]: seaborn, which thicket otherwise complains about on import
    "polars",
    "pyarrow",
    "plotnine",
]
